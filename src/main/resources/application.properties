spring.application.name=NexTradeX

# Server Configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/api

# Database Configuration (H2 for development, change to PostgreSQL for production)
spring.datasource.url=${DB_URL:jdbc:h2:mem:nextradb}
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.h2.console.enabled=true

# JWT Configuration
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Logging
logging.level.root=INFO
logging.level.com.NexTradeX=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# CoinMarketCap API Key
coinmarketcap.api.key=${COINMARKETCAP_API_KEY}

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# WebSocket Configuration
ws.allowed.origins=${WS_ALLOWED_ORIGINS:http://localhost:3000}

# Allow circular references for Spring beans
spring.main.allow-circular-references=true
