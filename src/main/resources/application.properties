spring.application.name=NexTradeX

# Server Configuration
server.port=${PORT:${SERVER_PORT:8080}}
server.servlet.context-path=/api

# Database Configuration (PostgreSQL for Supabase)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:password}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration
jwt.secret=${JWT_SECRET:NexTradeX-Default-Secret-Key-For-Development-256-Bits-Minimum}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Redis Configuration
spring.redis.host=${REDIS_HOST:localhost}
spring.redis.port=${REDIS_PORT:6379}

# Logging
logging.level.root=INFO
logging.level.com.NexTradeX=DEBUG
logging.level.org.springframework.security=DEBUG
logging.level.org.springframework.web=INFO

# CoinMarketCap API Key
coinmarketcap.api.key=${COINMARKETCAP_API_KEY:demo}

# Binance API Configuration
binance.api-key=${BINANCE_API_KEY:}
binance.api-secret=${BINANCE_API_SECRET:}
binance.base-url=https://api.binance.com

# CORS Configuration
cors.allowed.origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# WebSocket Configuration
ws.allowed.origins=${WS_ALLOWED_ORIGINS:http://localhost:3000}

# Allow circular references for Spring beans
spring.main.allow-circular-references=true

spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=openid,profile,email
spring.security.oauth2.client.registration.google.redirect-uri=${OAUTH_REDIRECT_URI:http://localhost:8080/api/login/oauth2/code/google}
spring.security.oauth2.client.provider.google.authorization-uri=https://accounts.google.com/o/oauth2/v2/auth
spring.security.oauth2.client.provider.google.token-uri=https://oauth2.googleapis.com/token
spring.security.oauth2.client.provider.google.user-info-uri=https://www.googleapis.com/oauth2/v3/userinfo
spring.security.oauth2.client.registration.google.authorized-js-uris=http://localhost:3000,http://localhost:8080

oauth.frontend.callback-url=${FRONTEND_CALLBACK_URL:http://localhost:3000/auth}

# SpringDoc / Swagger UI Configuration
springdoc.swagger-ui.enabled=true
springdoc.api-docs.enabled=true
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operationsSorter=method
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.tryItOutEnabled=true
springdoc.swagger-ui.filter=true
# Required when both WebMVC and WebFlux are on the classpath
springdoc.use-management-port=false
springdoc.show-actuator=false