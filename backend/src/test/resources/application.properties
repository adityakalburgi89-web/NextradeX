spring.datasource.url=jdbc:h2:mem:nextradex-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.data.redis.repositories.enabled=false
spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.username=default
spring.data.redis.password=test-only
spring.data.redis.ssl.enabled=false
spring.config.import=

nextradex.bootstrap.enabled=false
nextradex.scheduling.enabled=false
nextradex.market.websocket.enabled=false

jwt.secret=0123456789012345678901234567890123456789012345678901234567890123
jwt.expiration=3600000
jwt.issuer=nextradex-test
jwt.audience=nextradex-test-client
cors.allowed.origins=http://localhost:3000
ws.allowed.origins=http://localhost:3000
oauth.frontend.callback-url=http://localhost:3000/auth

spring.security.oauth2.client.registration.google.client-id=test-client
spring.security.oauth2.client.registration.google.client-secret=test-secret

spring.rabbitmq.host=localhost
spring.rabbitmq.port=5672
spring.rabbitmq.username=guest
spring.rabbitmq.password=guest
spring.rabbitmq.virtual-host=/
spring.rabbitmq.ssl.enabled=false
spring.rabbitmq.dynamic=false
spring.rabbitmq.listener.simple.auto-startup=false
spring.rabbitmq.listener.direct.auto-startup=false
