version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: nextrade-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

  backend:
    build:
      context: ../../backend
      dockerfile: Dockerfile
    container_name: nextrade-backend
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=local
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - redis
    restart: unless-stopped

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
    container_name: nextrade-frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
